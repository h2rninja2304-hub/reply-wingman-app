<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ReplyAI — Your Personal Reply Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --bg-1: #0A0C13;
    --bg-2: #10131F;
    --surface: rgba(18, 22, 35, 0.94);
    --surface-raised: #171B2B;
    --surface-hover: #1F2438;
    --text: #F3F5FC;
    --text-muted: #8B92A7;
    --text-dim: #60677D;
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.16);
    --danger: #FF637E;
    --shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.5);

    --brand-a: #A078FF;
    --brand-b: #FF75A0;

    --tone-pickup: #FFBE3B;   --tone-pickup-ink: #1F1400;
    --tone-flirty: #FF6584;   --tone-flirty-ink: #26050E;
    --tone-bold:   #F43F5E;   --tone-bold-ink:   #FFFFFF;
    --tone-casual: #38BDF8;   --tone-casual-ink: #032030;
    --tone-pro:    #818CF8;   --tone-pro-ink:    #0B1033;
    --tone-romantic: #D8A7FF; --tone-romantic-ink: #24112F;
    --tone-funny:  #2DD4BF;   --tone-funny-ink:  #042B24;

    --tone-accent: var(--tone-flirty);
    --tone-ink: var(--tone-flirty-ink);

    --font-head: "Bricolage Grotesque", -apple-system, system-ui, sans-serif;
    --font-body: "Inter", -apple-system, system-ui, sans-serif;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg-1: #F8F9FC;
      --bg-2: #EEF1F8;
      --surface: #FFFFFF;
      --surface-raised: #F2F5FB;
      --surface-hover: #E7ECF6;
      --text: #191E2B;
      --text-muted: #647087;
      --text-dim: #929EB4;
      --border: rgba(0, 0, 0, 0.08);
      --border-strong: rgba(0, 0, 0, 0.15);
      --shadow: 0 14px 35px -12px rgba(25, 30, 50, 0.12);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    background: var(--bg-1);
  }

  body {
    display: flex;
    justify-content: center;
    padding: 0 12px 40px;
    background:
      radial-gradient(550px 280px at 50% -40px, color-mix(in srgb, var(--tone-accent) 14%, transparent), transparent 70%),
      linear-gradient(180deg, var(--bg-2), var(--bg-1) 280px);
    transition: background .35s ease;
  }

  main {
    width: 100%;
    max-width: 480px;
    padding-top: 18px;
  }

  /* Compact Header */
  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
    padding: 0 2px;
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .mark {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--brand-a), var(--brand-b));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: #1A0A10;
    box-shadow: 0 6px 16px -4px rgba(255, 101, 132, 0.4);
    font-weight: 700;
  }

  h1 {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
  }
  .status-pill i {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #34D399;
    box-shadow: 0 0 6px #34D399;
  }

  .tagline {
    color: var(--text-muted);
    font-size: 12px;
    line-height: 1.45;
    margin: 4px 2px 14px;
  }

  /* Main Card */
  section.card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 16px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(16px);
  }

  .field-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 7px;
  }

  .field-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .badge-tag {
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    background: var(--surface-raised);
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid var(--border);
  }

  /* Arrow Option Dropdown Selector */
  .tone-selector-wrap {
    position: relative;
    margin-bottom: 14px;
  }

  .tone-trigger {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 9px 12px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all .16s ease;
  }
  .tone-trigger:hover {
    background: var(--surface-hover);
    border-color: var(--border-strong);
  }
  .tone-trigger:focus-visible {
    outline: 2px solid var(--tone-accent);
    outline-offset: 1px;
  }

  .tone-current {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tone-current .emoji {
    font-size: 15px;
    line-height: 1;
  }
  .tone-current .label {
    font-weight: 600;
    font-size: 13px;
  }

  .tone-arrow {
    width: 16px;
    height: 16px;
    color: var(--text-muted);
    transition: transform .2s ease;
    flex-shrink: 0;
  }
  .tone-arrow.rotated {
    transform: rotate(180deg);
    color: var(--tone-accent);
  }

  .tone-dropdown {
    position: absolute;
    top: calc(100% + 5px);
    left: 0;
    right: 0;
    background: var(--surface-raised);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    padding: 5px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    z-index: 50;
    display: none;
    max-height: 240px;
    overflow-y: auto;
    scrollbar-width: thin;
  }
  .tone-dropdown.open {
    display: block;
    animation: dropIn .15s ease both;
  }
  @keyframes dropIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .tone-opt {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: transparent;
    border: none;
    border-radius: 8px;
    padding: 7px 9px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 12.5px;
    cursor: pointer;
    text-align: left;
    transition: background .12s ease;
  }
  .tone-opt:hover {
    background: var(--surface-hover);
  }
  .tone-opt.selected {
    background: color-mix(in srgb, var(--tone-accent) 15%, transparent);
    color: var(--text);
    font-weight: 600;
  }
  .tone-opt-left {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .tone-opt-left .emoji {
    font-size: 14px;
    flex-shrink: 0;
  }
  .tone-opt-info {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .tone-opt-info .title {
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1.2;
  }
  .tone-opt-info .sub {
    font-size: 10.5px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tone-opt-check {
    color: var(--tone-accent);
    font-size: 12px;
    font-weight: 700;
    padding-left: 6px;
  }

  .tone-desc {
    font-size: 11.5px;
    color: var(--text-muted);
    margin: 5px 2px 0;
    line-height: 1.4;
  }
  .tone-desc strong {
    color: var(--tone-accent);
  }

  /* Compact Chat Box with Integrated Screenshot */
  .chat-box {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 11px 8px;
    transition: border-color .16s ease, box-shadow .16s ease;
    margin-bottom: 12px;
  }
  .chat-box:focus-within {
    border-color: color-mix(in srgb, var(--tone-accent) 55%, transparent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--tone-accent) 10%, transparent);
  }
  .chat-box.drag-over {
    border-color: var(--tone-accent);
    background: color-mix(in srgb, var(--tone-accent) 6%, var(--surface-raised));
  }

  /* Integrated Screenshot Inside Chat Box */
  .shot-preview {
    display: none;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 5px 8px 5px 6px;
    margin-bottom: 7px;
  }
  .shot-preview.show {
    display: flex;
  }
  .shot-preview img {
    width: 34px;
    height: 34px;
    object-fit: cover;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .shot-info {
    flex: 1;
    min-width: 0;
  }
  .shot-info .name {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: block;
  }
  .shot-info .meta {
    font-size: 10px;
    color: var(--text-dim);
  }
  .shot-remove {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 4px;
    border-radius: 4px;
  }
  .shot-remove:hover {
    color: var(--danger);
  }

  /* Smaller Textarea */
  textarea {
    width: 100%;
    min-height: 64px;
    max-height: 160px;
    resize: vertical;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 13px;
    line-height: 1.45;
    padding: 0;
  }
  textarea::placeholder {
    color: var(--text-dim);
    font-size: 12.5px;
  }

  /* Action Bar Inside Chat Box */
  .chat-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
  }

  .attach-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 4px 8px;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
    transition: all .14s ease;
  }
  .attach-btn:hover {
    background: var(--surface-hover);
    color: var(--text);
    border-color: var(--border-strong);
  }
  .attach-btn svg {
    width: 13px;
    height: 13px;
    color: var(--tone-accent);
  }
  .attach-btn input[type="file"] {
    display: none;
  }

  .chat-hint {
    font-size: 10.5px;
    color: var(--text-dim);
  }

  /* Bottom Controls */
  .controls-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 10px 0 14px;
  }

  .stepper {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 5px;
  }
  .stepper button {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: none;
    background: var(--surface-hover);
    color: var(--text);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .12s ease;
  }
  .stepper button:hover:not(:disabled) {
    background: var(--border-strong);
  }
  .stepper button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .stepper span {
    min-width: 14px;
    text-align: center;
    font-size: 12.5px;
    font-weight: 600;
  }

  /* CTA Button */
  .cta {
    width: 100%;
    min-height: 44px;
    background: linear-gradient(135deg, var(--tone-accent), color-mix(in srgb, var(--tone-accent) 80%, white));
    color: var(--tone-ink);
    border: none;
    border-radius: 11px;
    padding: 10px 14px;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 13.5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: all .16s ease;
    box-shadow: 0 8px 20px -6px color-mix(in srgb, var(--tone-accent) 50%, transparent);
  }
  .cta:hover {
    opacity: 0.94;
    transform: translateY(-1px);
  }
  .cta:active {
    transform: scale(0.99);
  }
  .cta:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    transform: none;
  }
  .cta .arrow {
    font-size: 14px;
    transition: transform .14s ease;
  }
  .cta:hover .arrow {
    transform: translate(2px, -2px);
  }

  .status-text {
    font-size: 11.5px;
    color: var(--text-muted);
    text-align: center;
    margin-top: 7px;
    min-height: 14px;
  }

  .error-box {
    background: rgba(255, 99, 126, 0.08);
    border: 1px solid rgba(255, 99, 126, 0.3);
    color: var(--danger);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 12px;
    margin-top: 10px;
    line-height: 1.4;
  }

  /* Results Section */
  .results-card {
    margin-top: 14px;
  }
  .results-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 0 2px 10px;
  }
  .results-head h2 {
    font-family: var(--font-head);
    font-size: 14.5px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .results-head .retry {
    background: none;
    border: none;
    color: var(--tone-accent);
    font-weight: 600;
    font-size: 11.5px;
    cursor: pointer;
    padding: 3px 6px;
    border-radius: 4px;
  }
  .results-head .retry:hover {
    text-decoration: underline;
  }
  .results-head .retry:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .replies {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-end;
  }

  .bubble {
    max-width: 90%;
    background: linear-gradient(135deg, var(--tone-accent), color-mix(in srgb, var(--tone-accent) 85%, black));
    color: var(--tone-ink);
    padding: 10px 13px;
    border-radius: 14px 14px 3px 14px;
    font-size: 13px;
    line-height: 1.45;
    animation: pop .2s ease both;
    box-shadow: 0 6px 16px -6px color-mix(in srgb, var(--tone-accent) 60%, transparent);
  }
  .bubble-content {
    word-break: break-word;
  }
  .bubble .copy-btn {
    display: inline-block;
    margin-top: 7px;
    background: rgba(0, 0, 0, 0.18);
    border: none;
    color: inherit;
    font-size: 10.5px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    cursor: pointer;
    float: right;
    transition: background .12s ease;
  }
  .bubble .copy-btn:hover {
    background: rgba(0, 0, 0, 0.28);
  }
  .bubble .copy-btn.copied {
    background: rgba(0, 0, 0, 0.38);
  }

  @keyframes pop {
    from { opacity: 0; transform: translateY(4px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Thinking Indicator */
  .thinking {
    display: flex;
    justify-content: flex-end;
    margin-top: 10px;
  }
  .thinking .bubble-loading {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    padding: 10px 14px;
    border-radius: 14px 14px 3px 14px;
    display: flex;
    gap: 4px;
  }
  .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: bounce 1.1s infinite ease-in-out;
  }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-3px); opacity: 1; }
  }

  footer.note {
    text-align: center;
    color: var(--text-dim);
    font-size: 10.5px;
    margin-top: 20px;
    display: flex;
    justify-content: center;
    gap: 6px;
  }
</style>
</head>
<body>
<main>

  <div id="app">
    <header class="top">
      <div class="brand-group">
        <div class="mark"><span>✦</span></div>
        <h1>ReplyAI</h1>
      </div>
      <span class="status-pill"><i></i> Personal AI</span>
    </header>
    <p class="tagline">Generate witty, personalized replies and conversation openers in seconds.</p>

    <section class="card">
      <!-- 01: Vibe Selector with Arrow Dropdown -->
      <div class="field-row">
        <span class="field-label">Vibe / Tone</span>
        <span class="badge-tag">Select</span>
      </div>

      <div class="tone-selector-wrap" id="toneSelectorWrap">
        <button type="button" class="tone-trigger" id="toneTrigger" aria-expanded="false" aria-haspopup="true">
          <div class="tone-current">
            <span class="emoji" id="currentToneEmoji">😏</span>
            <span class="label" id="currentToneName">Flirty & dating</span>
          </div>
          <svg class="tone-arrow" id="toneArrow" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.51a.75.75 0 01-1.08 0l-4.25-4.51a.75.75 0 01.02-1.06z" clip-rule="evenodd"/>
          </svg>
        </button>

        <div class="tone-dropdown" id="toneDropdown" role="listbox">
          <!-- Populated by JavaScript -->
        </div>
        <p class="tone-desc" id="toneDesc"></p>
      </div>

      <!-- 02: Chat Box with Screenshot Inside -->
      <div class="field-row">
        <span class="field-label" id="convoLabel">Conversation</span>
        <span class="badge-tag">Context</span>
      </div>

      <div class="chat-box" id="chatBox">
        <!-- Integrated Screenshot Preview Inside Chat Box -->
        <div class="shot-preview" id="shotPreview">
          <img id="shotThumb" alt="Screenshot preview">
          <div class="shot-info">
            <span class="name" id="shotName"></span>
            <span class="meta">Screenshot attached</span>
          </div>
          <button type="button" class="shot-remove" id="removeShot" aria-label="Remove screenshot">✕</button>
        </div>

        <!-- Smaller Textarea -->
        <textarea id="convoText" rows="3" placeholder="Paste the message thread here..."></textarea>

        <!-- Chat Bottom Action Bar -->
        <div class="chat-toolbar">
          <label class="attach-btn" id="attachBtn" for="fileInput" tabindex="0">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
            <span id="attachBtnLabel">Add screenshot</span>
            <input type="file" id="fileInput" accept="image/*">
          </label>
          <span class="chat-hint">Paste text or drop image</span>
        </div>
      </div>

      <!-- 03: Controls -->
      <div class="controls-row">
        <span class="field-label">Number of replies</span>
        <div class="stepper">
          <button type="button" id="countDown" aria-label="Fewer replies">−</button>
          <span id="countValue">4</span>
          <button type="button" id="countUp" aria-label="More replies">+</button>
        </div>
      </div>

      <button type="button" class="cta" id="generateBtn">
        <span id="generateBtnText">Get replies</span>
        <span class="arrow">↗</span>
      </button>

      <p class="status-text" id="hint">&nbsp;</p>
      <div class="error-box" id="errorBox" style="display:none;"></div>
    </section>

    <!-- Results Section -->
    <div id="resultsSection" class="results-card" style="display:none;">
      <div class="results-head">
        <h2 id="resultsTitle">Suggested replies</h2>
        <button type="button" class="retry" id="retryBtn">Try different replies</button>
      </div>
      <div class="replies" id="repliesList"></div>
    </div>

    <!-- Thinking Indicator -->
    <div class="thinking" id="thinkingRow" style="display:none;">
      <div class="bubble-loading">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
  </div>

  <footer class="note">
    <span>Private by design</span>
    <span>•</span>
    <span>AI suggestions — review before sending</span>
  </footer>
</main>

<script>
(function () {
  const TONES = [
    {
      id: "flirty",
      label: "Flirty & dating",
      emoji: "😏",
      color: "var(--tone-flirty)",
      ink: "var(--tone-flirty-ink)",
      desc: "Playful, charming & confident vibe",
      promptDesc: "flirty, playful and confident — the tone of a charming, fun match who knows how to keep a conversation exciting without being cringey",
      needsConvo: true,
      convoLabel: "Conversation",
      placeholder: "Paste the message thread here, e.g.\nThem: hey stranger, long time no text\nYou: ...",
      resultsTitle: "Suggested replies",
    },
    {
      id: "pickup",
      label: "Pick-up line",
      emoji: "💘",
      color: "var(--tone-pickup)",
      ink: "var(--tone-pickup-ink)",
      desc: "Clever opening lines to break the ice",
      promptDesc: "playful, witty pick-up lines or conversation openers — confident, original and charming, never crude, corny clichés, or offensive",
      needsConvo: false,
      convoLabel: "Context (optional)",
      placeholder: "Optional — paste their bio, interests, or profile info to personalize...",
      resultsTitle: "Suggested openers",
      isOpener: true,
    },
    {
      id: "bold",
      label: "Bold & spicy",
      emoji: "🔥",
      color: "var(--tone-bold)",
      ink: "var(--tone-bold-ink)",
      desc: "Teasing & cheeky with extra heat",
      promptDesc: "bolder and spicier than typical flirty texting — confident, teasing and suggestive in a playful way, while staying tasteful and respectful and avoiding anything explicit or crude",
      needsConvo: true,
      convoLabel: "Conversation",
      placeholder: "Paste the message thread here…",
      resultsTitle: "Suggested replies",
    },
    {
      id: "casual",
      label: "Casual",
      emoji: "💬",
      color: "var(--tone-casual)",
      ink: "var(--tone-casual-ink)",
      desc: "Easygoing & natural friendly tone",
      promptDesc: "casual, warm and relaxed — the tone you'd use texting a friend, easygoing and natural",
      needsConvo: true,
      convoLabel: "Conversation",
      placeholder: "Paste the message thread here…",
      resultsTitle: "Suggested replies",
    },
    {
      id: "professional",
      label: "Professional",
      emoji: "🧳",
      color: "var(--tone-pro)",
      ink: "var(--tone-pro-ink)",
      desc: "Clear, polite & work-appropriate",
      promptDesc: "polite, clear and professional — concise and appropriate for a work or formal messaging context",
      needsConvo: true,
      convoLabel: "Conversation",
      placeholder: "Paste the message thread here…",
      resultsTitle: "Suggested replies",
    },
    {
      id: "romantic",
      label: "Romantic",
      emoji: "♥",
      color: "var(--tone-romantic)",
      ink: "var(--tone-romantic-ink)",
      desc: "Warm, sweet & genuine affection",
      promptDesc: "romantic, warm and affectionate — sincere, natural and emotionally thoughtful without sounding overly dramatic",
      needsConvo: true,
      convoLabel: "Conversation",
      placeholder: "Paste the message thread here…",
      resultsTitle: "Romantic replies",
    },
    {
      id: "funny",
      label: "Funny",
      emoji: "✨",
      color: "var(--tone-funny)",
      ink: "var(--tone-funny-ink)",
      desc: "Witty humor to keep things light",
      promptDesc: "funny, witty and playful — natural humor that fits the conversation without forcing a joke",
      needsConvo: true,
      convoLabel: "Conversation",
      placeholder: "Paste the message thread here…",
      resultsTitle: "Funny replies",
    },
  ];

  const state = {
    toneId: "flirty",
    count: 4,
    imageBlob: null,
  };

  function currentTone() {
    return TONES.find(t => t.id === state.toneId) || TONES[0];
  }

  const els = {
    toneSelectorWrap: document.getElementById("toneSelectorWrap"),
    toneTrigger: document.getElementById("toneTrigger"),
    toneArrow: document.getElementById("toneArrow"),
    toneDropdown: document.getElementById("toneDropdown"),
    currentToneEmoji: document.getElementById("currentToneEmoji"),
    currentToneName: document.getElementById("currentToneName"),
    toneDesc: document.getElementById("toneDesc"),
    convoLabel: document.getElementById("convoLabel"),
    convoText: document.getElementById("convoText"),
    chatBox: document.getElementById("chatBox"),
    fileInput: document.getElementById("fileInput"),
    attachBtnLabel: document.getElementById("attachBtnLabel"),
    shotPreview: document.getElementById("shotPreview"),
    shotThumb: document.getElementById("shotThumb"),
    shotName: document.getElementById("shotName"),
    removeShot: document.getElementById("removeShot"),
    countValue: document.getElementById("countValue"),
    countDown: document.getElementById("countDown"),
    countUp: document.getElementById("countUp"),
    generateBtn: document.getElementById("generateBtn"),
    generateBtnText: document.getElementById("generateBtnText"),
    hint: document.getElementById("hint"),
    errorBox: document.getElementById("errorBox"),
    resultsSection: document.getElementById("resultsSection"),
    resultsTitle: document.getElementById("resultsTitle"),
    repliesList: document.getElementById("repliesList"),
    retryBtn: document.getElementById("retryBtn"),
    thinkingRow: document.getElementById("thinkingRow"),
  };

  // ---------- Tone Selector Dropdown with Arrow ----------
  function buildToneDropdown() {
    els.toneDropdown.innerHTML = "";
    TONES.forEach(t => {
      const opt = document.createElement("button");
      opt.type = "button";
      opt.className = "tone-opt" + (t.id === state.toneId ? " selected" : "");
      opt.dataset.tone = t.id;
      opt.setAttribute("role", "option");
      opt.setAttribute("aria-selected", t.id === state.toneId ? "true" : "false");
      opt.innerHTML = `
        <div class="tone-opt-left">
          <span class="emoji">${t.emoji}</span>
          <div class="tone-opt-info">
            <span class="title">${t.label}</span>
            <span class="sub">${t.desc}</span>
          </div>
        </div>
        <span class="tone-opt-check">${t.id === state.toneId ? "✓" : ""}</span>
      `;
      opt.addEventListener("click", () => {
        selectTone(t.id);
        closeToneDropdown();
      });
      els.toneDropdown.appendChild(opt);
    });
  }

  function openToneDropdown() {
    els.toneDropdown.classList.add("open");
    els.toneTrigger.setAttribute("aria-expanded", "true");
    els.toneArrow.classList.add("rotated");
  }

  function closeToneDropdown() {
    els.toneDropdown.classList.remove("open");
    els.toneTrigger.setAttribute("aria-expanded", "false");
    els.toneArrow.classList.remove("rotated");
  }

  function toggleToneDropdown() {
    if (els.toneDropdown.classList.contains("open")) {
      closeToneDropdown();
    } else {
      openToneDropdown();
    }
  }

  els.toneTrigger.addEventListener("click", toggleToneDropdown);

  document.addEventListener("click", (e) => {
    if (!els.toneSelectorWrap.contains(e.target)) {
      closeToneDropdown();
    }
  });

  function selectTone(id) {
    state.toneId = id;
    const t = currentTone();

    document.documentElement.style.setProperty("--tone-accent", t.color);
    document.documentElement.style.setProperty("--tone-ink", t.ink);

    els.currentToneEmoji.textContent = t.emoji;
    els.currentToneName.textContent = t.label;
    els.toneDesc.innerHTML = '<strong>' + t.label + '</strong> — ' + t.desc;
    els.convoLabel.textContent = t.convoLabel;
    els.convoText.placeholder = t.placeholder;
    els.resultsTitle.textContent = t.resultsTitle;
    els.generateBtnText.textContent = t.isOpener ? "Get openers" : "Get replies";
    els.retryBtn.textContent = t.isOpener ? "Try different openers" : "Try different replies";

    [...els.toneDropdown.children].forEach(c => {
      const isCur = c.dataset.tone === id;
      c.classList.toggle("selected", isCur);
      c.setAttribute("aria-selected", isCur ? "true" : "false");
      const check = c.querySelector(".tone-opt-check");
      if (check) check.textContent = isCur ? "✓" : "";
    });
  }

  buildToneDropdown();
  selectTone(state.toneId);

  // ---------- Stepper ----------
  function renderCount() {
    els.countValue.textContent = state.count;
    els.countDown.disabled = state.count <= 2;
    els.countUp.disabled = state.count >= 6;
  }
  els.countDown.addEventListener("click", () => {
    if (state.count > 2) { state.count--; renderCount(); }
  });
  els.countUp.addEventListener("click", () => {
    if (state.count < 6) { state.count++; renderCount(); }
  });
  renderCount();

  // ---------- Screenshot Upload Inside Chat Box ----------
  function setImage(file) {
    if (!file) return;
    state.imageBlob = file;
    const url = URL.createObjectURL(file);
    els.shotThumb.src = url;
    els.shotName.textContent = file.name || "Screenshot";
    els.shotPreview.classList.add("show");
    els.attachBtnLabel.textContent = "Replace screenshot";
  }

  function clearImage() {
    state.imageBlob = null;
    els.fileInput.value = "";
    els.shotPreview.classList.remove("show");
    els.attachBtnLabel.textContent = "Add screenshot";
  }

  els.fileInput.addEventListener("change", (e) => {
    if (e.target.files && e.target.files[0]) setImage(e.target.files[0]);
  });
  els.removeShot.addEventListener("click", (e) => {
    e.stopPropagation();
    clearImage();
  });

  // Drag and drop onto chat box
  ["dragenter", "dragover"].forEach(ev => {
    els.chatBox.addEventListener(ev, (e) => {
      e.preventDefault();
      els.chatBox.classList.add("drag-over");
    });
  });
  ["dragleave", "drop"].forEach(ev => {
    els.chatBox.addEventListener(ev, (e) => {
      e.preventDefault();
      els.chatBox.classList.remove("drag-over");
    });
  });
  els.chatBox.addEventListener("drop", (e) => {
    const f = e.dataTransfer && e.dataTransfer.files ? e.dataTransfer.files[0] : null;
    if (f && f.type.startsWith("image/")) setImage(f);
  });

  // Paste image directly into textarea
  els.convoText.addEventListener("paste", (e) => {
    const items = (e.clipboardData || e.originalEvent?.clipboardData)?.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.indexOf("image") === 0) {
        const file = item.getAsFile();
        if (file) {
          setImage(file);
          break;
        }
      }
    }
  });

  // ---------- Errors ----------
  function showError(msg) {
    els.errorBox.style.display = "block";
    els.errorBox.textContent = msg;
  }
  function clearError() {
    els.errorBox.style.display = "none";
    els.errorBox.textContent = "";
  }

  function copyForCode(code) {
    switch (code) {
      case "missing_key": return "The server isn't configured with an API key yet. Set GEMINI_API_KEY in your Vercel settings.";
      case "image_rejected": return "That image couldn't be processed — try a smaller screenshot.";
      case "rate_limited": return "Too many requests right now — please wait a few seconds and try again.";
      case "refused": return "That request couldn't be completed — try rephrasing the message.";
      case "prompt_too_large": return "Conversation is too long — try trimming it down.";
      case "empty_completion": return "No reply came back — try providing a bit more context.";
      case "network": return "Couldn't reach the server — check your internet connection.";
      default: return "Something went wrong generating replies. Please try again.";
    }
  }

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = () => reject(new Error("read_failed"));
      reader.readAsDataURL(blob);
    });
  }

  // ---------- Build Prompt ----------
  function buildPrompt() {
    const t = currentTone();
    const convo = els.convoText.value.trim();
    const lines = [];
    lines.push('You are a witty, emotionally intelligent texting assistant.');
    lines.push('Desired tone: ' + t.promptDesc + '.');

    if (t.isOpener) {
      lines.push('The user wants opening lines to start a chat with someone new (e.g. on a dating app), not a reply to an existing conversation.');
      if (convo) lines.push('Optional context about the person to personalize the lines:\n"""\n' + convo + '\n"""');
      if (state.imageBlob) lines.push('An optional screenshot (e.g. of their profile) is attached for extra context.');
      lines.push('Write ' + state.count + ' distinct opening lines the user could send first. Each should be short (1-2 sentences), original, and clearly different in angle or energy from the others while matching the tone.');
    } else {
      if (convo) lines.push('Here is the conversation so far (most recent message last):\n"""\n' + convo + '\n"""');
      if (state.imageBlob) lines.push('A screenshot of the conversation is attached — read the messages in it for context (combine with any pasted text above if present).');
      lines.push('Write ' + state.count + ' distinct reply options the user could send next. Each should be short (1-2 sentences), natural, ready to send as-is, and clearly different from the others in angle or energy while matching the tone.');
    }
    lines.push('Reply with ONLY a JSON array of ' + state.count + ' strings, each one full message. No commentary, no markdown, no numbering.');
    return lines.join("\n\n");
  }

  // ---------- Render Results ----------
  function renderReplies(list) {
    els.repliesList.innerHTML = "";
    list.forEach((text) => {
      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const content = document.createElement("div");
      content.className = "bubble-content";
      content.textContent = text;
      bubble.appendChild(content);

      const copyBtn = document.createElement("button");
      copyBtn.type = "button";
      copyBtn.className = "copy-btn";
      copyBtn.textContent = "Copy";
      copyBtn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(text);
          copyBtn.textContent = "Copied ✓";
          copyBtn.classList.add("copied");
          setTimeout(() => {
            copyBtn.textContent = "Copy";
            copyBtn.classList.remove("copied");
          }, 1600);
        } catch (e) {
          copyBtn.textContent = "Select & copy";
        }
      });
      bubble.appendChild(copyBtn);
      els.repliesList.appendChild(bubble);
    });
    els.resultsSection.style.display = "block";
    els.resultsSection.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  // ---------- Generate ----------
  async function generate() {
    clearError();
    const t = currentTone();
    const convo = els.convoText.value.trim();
    if (t.needsConvo && !convo && !state.imageBlob) {
      showError("Paste some text or attach a screenshot first.");
      return;
    }

    els.generateBtn.disabled = true;
    els.retryBtn.disabled = true;
    els.thinkingRow.style.display = "flex";
    els.hint.textContent = "Thinking…";

    try {
      let imagePayload = null;
      if (state.imageBlob) {
        imagePayload = {
          mediaType: state.imageBlob.type || "image/jpeg",
          data: await blobToBase64(state.imageBlob),
        };
      }

      const res = await fetch("/api/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: buildPrompt(), image: imagePayload }),
      });

      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw { code: body.code || "upstream_error" };

      let list = Array.isArray(body.replies) ? body.replies : null;
      if (!list) throw { code: "invalid_json" };
      list = list.filter(x => typeof x === "string" && x.trim()).slice(0, state.count);
      if (!list.length) throw { code: "empty_completion" };

      renderReplies(list);
      els.hint.textContent = "";
    } catch (e) {
      const code = (e && e.code) ? e.code : "network";
      showError(copyForCode(code));
      els.hint.textContent = "";
    } finally {
      els.generateBtn.disabled = false;
      els.retryBtn.disabled = false;
      els.thinkingRow.style.display = "none";
    }
  }

  els.generateBtn.addEventListener("click", generate);
  els.retryBtn.addEventListener("click", generate);
})();
</script>
</body>
</html>
